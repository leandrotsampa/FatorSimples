name: Publicar site

# Publica o site (site/) no GitHub Pages a cada mudança nele, nas capturas de docs/ ou no ícone.
# Versão, links de download e tabelas fiscais são lidos do GitHub pelo navegador: uma release
# nova ou um tabelas.json novo aparecem no site sem precisar publicar de novo.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'docs/demo.webp'
      - 'build/icon.png'
      - 'scripts/site/build.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Montar o site
        run: node scripts/site/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
