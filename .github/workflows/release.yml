name: Gerar release

# Disparo manual: Actions → Gerar release → Run workflow.
# A versão vem do package.json; ajuste o campo "version" antes de rodar.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Marcar como pré-lançamento (versão de teste)
        type: boolean
        default: false
      draft:
        description: Criar como rascunho (revisar antes de publicar)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build e publicação
    runs-on: windows-latest
    env:
      # Sem certificado de assinatura de código: gera o executável sem assinar
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ler a versão
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::A versão v$VERSION já foi publicada. Aumente o campo \"version\" do package.json e rode de novo."
            exit 1
          fi
          echo "Versão a publicar: v$VERSION"

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run lint

      - name: Gerar executável portátil
        run: npm run dist:portable -- --publish never

      - name: Gerar changelog
        shell: bash
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" release-notes.md

      - name: Calcular checksum
        id: files
        shell: bash
        run: |
          EXE="release/FatorSimples-${{ steps.version.outputs.version }}-portable.exe"
          test -f "$EXE" || { echo "::error::Executável não encontrado: $EXE"; exit 1; }
          sha256sum "$EXE" | sed 's#release/##' > "$EXE.sha256"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "### 📥 Download"
            echo ""
            echo "Baixe o \`FatorSimples-${{ steps.version.outputs.version }}-portable.exe\` abaixo e coloque-o na mesma pasta do seu \`fatorsimples.sqlite\` (se já usa o app). Não precisa instalar."
            echo ""
            echo "SHA-256: \`$(cut -d' ' -f1 "$EXE.sha256")\`"
          } >> release-notes.md

      - name: Registrar o changelog no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FatorSimples ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          files: |
            ${{ steps.files.outputs.exe }}
            ${{ steps.files.outputs.exe }}.sha256
